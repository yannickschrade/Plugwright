# Documentation site of Plugwright. Build from this folder:
#   dotnet docfx metadata docfx.json && dotnet run tools/FixApiMarkdown.cs -- content/api
#   zensical build --strict    (or: zensical serve)
# The API reference in content/api is generated by DocFX; do not edit it.

[project]
site_name = "Plugwright"
site_url = "https://yannickschrade.github.io/Plugwright/"
site_description = "Plugin system for the .NET Generic Host"
repo_url = "https://github.com/yannickschrade/Plugwright"
repo_name = "yannickschrade/Plugwright"
edit_uri = "edit/main/docs/content/"
copyright = "Copyright &copy; Yannick Schrade. MIT license."
docs_dir = "content"
extra_css = ["stylesheets/extra.css"]
site_dir = "_site"

nav = [
  { "Home" = "index.md" },
  { "Tutorials" = [
    { "Getting started" = "tutorials/getting-started.md" },
  ] },
  { "How-to guides" = [
    { "Plugins" = [
      { "Add a plugin" = "how-to/add-a-plugin.md" },
      { "Find plugins in referenced assemblies" = "how-to/find-plugins-in-referenced-assemblies.md" },
      { "Declare plugin dependencies" = "how-to/declare-plugin-dependencies.md" },
      { "Offer extension points to plugins" = "how-to/offer-extension-points.md" },
      { "Write a plugin handler" = "how-to/write-a-plugin-handler.md" },
    ] },
    { "Web and Blazor" = [
      { "Use plugins in an ASP.NET Core app" = "how-to/use-in-a-web-app.md" },
      { "Add Blazor pages from plugins" = "how-to/add-blazor-pages.md" },
      { "One plugin, several kinds" = "how-to/combine-plugin-kinds.md" },
      { "Split a plugin across hosts" = "how-to/split-plugin-across-hosts.md" },
      { "Use Plugwright with .NET Aspire" = "how-to/use-with-aspire.md" },
    ] },
    { "Load and verify" = [
      { "Load plugins from a directory" = "how-to/load-plugins-from-a-directory.md" },
      { "Verify plugins with a lock file" = "how-to/verify-plugins-with-a-lock-file.md" },
      { "Sign plugins and trust their publisher" = "how-to/sign-plugins.md" },
      { "Load plugins from NuGet packages" = "how-to/load-plugins-from-packages.md" },
      { "Verify package signatures" = "how-to/verify-package-signatures.md" },
      { "Configure plugins from appsettings.json" = "how-to/configure-from-appsettings.md" },
    ] },
    { "Run and operate" = [
      { "Turn plugins on and off" = "how-to/enable-and-disable-plugins.md" },
      { "Required and optional plugins" = "how-to/required-and-optional-plugins.md" },
      { "Keep running when a plugin fails" = "how-to/handle-plugin-failures.md" },
      { "Run startup tasks" = "how-to/run-startup-tasks.md" },
      { "Restart the application" = "how-to/restart-the-application.md" },
      { "Inspect plugins at runtime" = "how-to/inspect-plugins-at-runtime.md" },
      { "Report plugin health" = "how-to/report-plugin-health.md" },
    ] },
    { "Develop and test" = [
      { "Develop plugins in a solution" = "how-to/develop-plugins-in-a-solution.md" },
      { "Test applications" = "how-to/test-apps.md" },
    ] },
  ] },
  { "Explanation" = [
    { "The two phases" = "explanation/two-phases.md" },
    { "Load contexts and shared assemblies" = "explanation/load-contexts.md" },
    { "Plugin states" = "explanation/plugin-states.md" },
    { "Security model" = "explanation/security-model.md" },
  ] },
  { "Reference" = [
    { "Configuration" = "reference/configuration.md" },
    { "Plugin metadata" = "reference/plugin-metadata.md" },
    { "Log events and telemetry" = "reference/log-events.md" },
    { "Command-line tool" = "reference/cli.md" },
    { "API" = "api/" },
  ] },
]

# The navigation of the generated API folder comes from content/api/SUMMARY.md, see tools/FixApiMarkdown.cs.
[project.plugins.literate-nav]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

# Code comes from samples/, marked with // --8<-- [start:name] and // --8<-- [end:name]. Paths are relative to the
# repository root; a missing file or section fails the build.
pymdownx.snippets.base_path = [".."]
pymdownx.snippets.check_paths = true
pymdownx.snippets.dedent_subsections = true
